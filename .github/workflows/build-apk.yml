name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Show the files
        run: ls -la

      - name: Prepare Android project
        run: python3 make_android_project.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME is $ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license" || true
          printf '\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle -p android_build assembleDebug --no-daemon --stacktrace --console=plain

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: SMC-Photo-Work-Station-APK
          path: android_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
